<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect x="50" y="80" width="140" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="120" y="125" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Central Planner (10)</text>
  <line x1="190" y1="120" x2="260" y2="120" stroke="#111" stroke-width="2"/>
  <polygon points="260,115 270,120 260,125" fill="#111"/>
  <rect x="270" y="80" width="160" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="350" y="110" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Reliability Module (14)</text>
  <text x="350" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">200 Hz loop</text>
  <line x1="430" y1="120" x2="500" y2="120" stroke="#111" stroke-width="2"/>
  <polygon points="500,115 510,120 500,125" fill="#111"/>
  <rect x="510" y="80" width="140" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="580" y="125" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Joint Controller (12)</text>
  <rect x="300" y="220" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="350" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Position Encoder (16)</text>
  <line x1="350" y1="220" x2="350" y2="160" stroke="#111" stroke-width="1.5"/>
  <text x="360" y="190" font-family="Helvetica, Arial, sans-serif" font-size="10">5 ms sample</text>
  <rect x="420" y="220" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="470" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Torque Sensor (18)</text>
  <line x1="470" y1="220" x2="400" y2="160" stroke="#111" stroke-width="1.5"/>
  <rect x="550" y="220" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="600" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Flash Memory (22)</text>
  <line x1="600" y1="220" x2="550" y2="160" stroke="#111" stroke-width="1.5"/>
  <rect x="510" y="340" width="140" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="580" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">PWM Driver (20)</text>
  <line x1="580" y1="160" x2="580" y2="340" stroke="#111" stroke-width="2"/>
  <polygon points="575,340 580,350 585,340" fill="#111"/>
  <rect x="550" y="440" width="80" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="590" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Motor (24)</text>
  <line x1="580" y1="400" x2="580" y2="440" stroke="#111" stroke-width="2"/>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="#111" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="280" y="90" width="20" height="60" fill="url(#hatch)" stroke="#111" stroke-width="1"/>
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
  <line x1="50" y1="200" x2="750" y2="200" stroke="#111" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="100" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10">Deviation threshold: 3 mm / 5 N</text>
  <text x="100" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10">Correction limit: 2 deg at 30 deg/s</text>
  <text x="100" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10">Replan window: 50 ms</text>
</svg>