<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Flow boxes -->
  <rect x="80" y="80" width="140" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="150" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Sensor (20) sample</text>
  <rect x="280" y="80" width="140" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="350" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Compute sigma</text>
  <rect x="480" y="80" width="140" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="550" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Calculate theta</text>
  <rect x="280" y="180" width="160" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="360" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Attenuation A = f(sigma,theta)</text>
  <rect x="280" y="280" width="160" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="360" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">If A>12 dB boost 6 dB</text>
  <rect x="280" y="380" width="160" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="360" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Apply delta_f 50-200 kHz</text>
  <rect x="280" y="480" width="160" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="360" y="510" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Modulation select</text>
  <!-- Arrows -->
  <line x1="220" y1="105" x2="280" y2="105" stroke="#111" stroke-width="2"/>
  <line x1="420" y1="105" x2="480" y2="105" stroke="#111" stroke-width="2"/>
  <line x1="550" y1="130" x2="360" y2="180" stroke="#111" stroke-width="2"/>
  <line x1="360" y1="230" x2="360" y2="280" stroke="#111" stroke-width="2"/>
  <line x1="360" y1="330" x2="360" y2="380" stroke="#111" stroke-width="2"/>
  <line x1="360" y1="430" x2="360" y2="480" stroke="#111" stroke-width="2"/>
  <!-- Fallback branch -->
  <rect x="520" y="280" width="140" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="590" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Fallback max power</text>
  <line x1="440" y1="305" x2="520" y2="305" stroke="#111" stroke-width="2"/>
  <line x1="590" y1="330" x2="590" y2="400" stroke="#111" stroke-width="2"/>
  <line x1="590" y1="400" x2="440" y2="505" stroke="#111" stroke-width="2"/>
  <!-- Numerals and leaders -->
  <line x1="80" y1="105" x2="40" y2="80" stroke="#111" stroke-width="1"/>
  <text x="20" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12">20</text>
  <line x1="280" y1="105" x2="240" y2="70" stroke="#111" stroke-width="1"/>
  <text x="210" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12">24</text>
  <line x1="480" y1="105" x2="440" y2="70" stroke="#111" stroke-width="1"/>
  <text x="410" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12">26</text>
  <line x1="280" y1="205" x2="220" y2="180" stroke="#111" stroke-width="1"/>
  <text x="190" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12">24</text>
  <line x1="280" y1="305" x2="220" y2="280" stroke="#111" stroke-width="1"/>
  <text x="190" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12">28</text>
  <line x1="520" y1="305" x2="480" y2="260" stroke="#111" stroke-width="1"/>
  <text x="450" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12">24</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 2</text>
</svg>